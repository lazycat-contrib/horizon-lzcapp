version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  sync_homepage: true
  sync_license: false
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: horizon
    channel: custom
    sort: created
    tag_regex: '^latest$'
    bump: patch

images:
  - id: horizon
    target: service
    service: horizon
    source: ghcr.io/dockers-x/horizon
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

build:
  run_buildscript: false
  toolchains: []

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: horizon
