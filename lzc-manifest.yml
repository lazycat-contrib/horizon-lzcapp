application:
  subdomain: horizon
  public_path:
    - /
services:
  horizon:
    # ghcr.io/dockers-x/horizon:latest (auto-built from Thysrael/Horizon)
    # upstream: ghcr.io/dockers-x/horizon:latest@sha256:7b49ea1433b3e4be7a8991af60f8d214e75ce646efa0511f9b8ba4ac7a3a7cc5
    image: ghcr.1ms.run/dockers-x/horizon:latest@sha256:7b49ea1433b3e4be7a8991af60f8d214e75ce646efa0511f9b8ba4ac7a3a7cc5
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/app/data
    command: --hours {{ .U.hours }}
usage: |
  首次使用：将 AI API Key（如 OPENAI_API_KEY）和信源配置 data/config.json 放入应用数据目录后触发运行。
  应用按计划每日生成中英双语简报，输出在数据目录中，可通过 webhook / 邮件推送。
